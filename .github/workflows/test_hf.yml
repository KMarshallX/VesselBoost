name: hugging face bucket test

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - tests/ci_helpers.sh
      - tests/test_hfintegration.sh
      - .github/workflows/test_hf.yml

permissions:
  contents: read

jobs:
  test_hf_bucket_integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v3
        with:
          python-version: 3.10.16
      - name: Install Hugging Face CLI
        run: python -m pip install "huggingface_hub==1.27.0"
      - name: Test public Hugging Face bucket integration
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: /bin/bash tests/test_hfintegration.sh
